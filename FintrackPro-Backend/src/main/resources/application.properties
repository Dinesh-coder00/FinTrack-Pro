# ============================================================
# FinTrack Pro â Application Configuration
# ============================================================

# ── Server ─────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── DataSource ──────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?sslMode=REQUIRED
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ─────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── JWT ─────────────────────────────────────
app.jwt.secret=FinTrackProSuperSecretKey2024ChangeThisInProduction!!
app.jwt.expiration-ms=86400000

# ── CORS ────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000
app.name=FinTrack Pro

# ── SMTP Email ──────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ── Logging ─────────────────────────────────
logging.level.com.fintrack=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.mail=DEBUG
logging.level.org.hibernate.SQL=WARN